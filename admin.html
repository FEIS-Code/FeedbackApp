<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FEIS Feedback — Admin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-gray-50">

<header class="bg-white shadow-md p-3 sm:p-4 sticky top-0 z-20">
  <div class="max-w-4xl mx-auto flex justify-between items-center">
    <h1 class="text-base sm:text-xl font-extrabold">
      <span class="text-red-800">FEIS</span> <span class="text-gray-600">Feedback Admin</span>
    </h1>
    <div class="flex items-center gap-2">
      <span id="user-badge" class="hidden text-xs font-medium text-indigo-700 bg-indigo-50 px-2 py-1 rounded-full"></span>
      <button id="logout-btn" onclick="logout()" class="hidden px-3 py-1.5 bg-gray-200 text-gray-700 font-semibold rounded-lg text-xs flex items-center gap-1">
        <i data-lucide="log-out" class="w-4 h-4"></i> Logout
      </button>
    </div>
  </div>
</header>

<!-- LOGIN SCREEN -->
<div id="login-screen" class="max-w-sm mx-auto mt-20 p-3">
  <div class="bg-white rounded-xl shadow-lg p-6">
    <h2 class="text-lg font-bold text-indigo-600 mb-4 text-center">Admin Login</h2>
    <form id="login-form" class="space-y-3">
      <input id="login-user" type="text" required placeholder="Username" class="w-full rounded-lg border p-2.5 text-sm">
      <input id="login-pass" type="password" required placeholder="Password" class="w-full rounded-lg border p-2.5 text-sm">
      <p id="login-error" class="text-red-600 text-xs hidden"></p>
      <button type="submit" class="w-full py-2.5 bg-indigo-600 text-white font-semibold rounded-lg text-sm">Login</button>
    </form>
  </div>
</div>

<!-- ADMIN CONTENT -->
<div id="admin-content" class="hidden">
  <div class="max-w-4xl mx-auto px-3 pt-3">
    <div class="flex gap-1 border-b overflow-x-auto">
      <button onclick="switchTab('feed')" data-tab="feed" class="tab-btn px-3 py-2 text-xs sm:text-sm font-semibold border-b-2 border-indigo-600 text-indigo-600 whitespace-nowrap">All Feedback</button>
      <button onclick="switchTab('stats')" data-tab="stats" class="tab-btn px-3 py-2 text-xs sm:text-sm font-semibold border-b-2 border-transparent text-gray-500 whitespace-nowrap">Stats</button>
      <button onclick="switchTab('settings')" data-tab="settings" class="tab-btn px-3 py-2 text-xs sm:text-sm font-semibold border-b-2 border-transparent text-gray-500 whitespace-nowrap">Settings</button>
    </div>
  </div>

  <main class="max-w-4xl mx-auto p-3 sm:p-6">

    <!-- FEED TAB -->
    <div id="tab-feed">
      <div class="flex flex-col sm:flex-row gap-2 mb-4">
        <input id="search" type="text" placeholder="Search..." oninput="renderFeed()" class="flex-1 px-3 py-2 border rounded-lg text-sm">
        <select id="filter-cat" onchange="renderFeed()" class="px-3 py-2 border rounded-lg text-sm"><option value="">All Categories</option></select>
        <select id="filter-status" onchange="renderFeed()" class="px-3 py-2 border rounded-lg text-sm">
          <option value="">All Status</option><option value="New">New</option><option value="Responded">Responded</option>
        </select>
      </div>
      <div id="feed-list" class="space-y-3"></div>
      <p id="no-feedback" class="hidden text-center text-gray-400 py-8">No feedback found.</p>
    </div>

    <!-- STATS TAB -->
    <div id="tab-stats" class="hidden space-y-4">
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div class="bg-white rounded-xl shadow p-4 text-center"><div class="text-3xl font-bold text-indigo-600" id="stat-total">0</div><div class="text-xs text-gray-500">Total</div></div>
        <div class="bg-white rounded-xl shadow p-4 text-center"><div class="text-3xl font-bold text-amber-500" id="stat-avg">0</div><div class="text-xs text-gray-500">Avg Rating</div></div>
        <div class="bg-white rounded-xl shadow p-4 text-center"><div class="text-3xl font-bold text-green-600" id="stat-responded">0</div><div class="text-xs text-gray-500">Responded</div></div>
        <div class="bg-white rounded-xl shadow p-4 text-center"><div class="text-3xl font-bold text-red-500" id="stat-new">0</div><div class="text-xs text-gray-500">Pending</div></div>
      </div>
      <div class="bg-white rounded-xl shadow p-4">
        <h3 class="font-bold text-sm text-gray-700 mb-3">By Category</h3>
        <div id="cat-stats" class="space-y-2"></div>
      </div>
    </div>

    <!-- SETTINGS TAB -->
    <div id="tab-settings" class="hidden space-y-4">
      <div class="bg-white rounded-xl shadow-lg p-4">
        <h3 class="font-bold text-gray-800 mb-3">Categories</h3>
        <div id="cat-list" class="flex flex-wrap gap-2 mb-3"></div>
        <div class="flex gap-2"><input id="new-cat" type="text" placeholder="New category" class="rounded border p-2 text-sm flex-1"><button onclick="addCat()" class="text-indigo-600 text-sm font-medium">+ Add</button></div>
      </div>
      <div class="flex gap-2">
        <button onclick="saveSettings()" class="px-4 py-2 bg-green-600 text-white font-semibold rounded-lg text-sm">Save Settings</button>
        <button onclick="runSetup()" class="px-4 py-2 bg-amber-500 text-white font-semibold rounded-lg text-sm">Setup Data</button>
      </div>
    </div>

  </main>
</div>

<!-- RESPOND MODAL -->
<div id="respond-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black bg-opacity-70 backdrop-blur-sm p-4">
  <div class="bg-white p-5 rounded-xl shadow-2xl w-full max-w-sm">
    <div class="flex justify-between items-center mb-4 border-b pb-2">
      <h2 class="text-lg font-bold text-green-600">Respond</h2>
      <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <form id="respond-form" class="space-y-3">
      <input type="hidden" id="resp-id">
      <div class="text-xs text-gray-500">ID: <span id="resp-id-display" class="font-mono"></span></div>
      <textarea id="resp-text" rows="3" required placeholder="Your response..." class="w-full rounded-lg border p-2.5 text-sm"></textarea>
      <button type="submit" class="w-full py-2.5 bg-green-600 text-white font-semibold rounded-lg text-sm">Send Response</button>
    </form>
  </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyJx7XoCZEVs9sAX1Xi6H9X0ICXcA_aJ6kpyHBm3-lislCUAfFlfagtgVeer0GPpiyH/exec';

let allFeedback = [], categories = [], currentUser = null;

async function fetchJSON(url) { return (await fetch(url, {redirect:'follow'})).json(); }

function stars(n) { return '<span class="text-amber-400">' + '★'.repeat(n) + '</span><span class="text-gray-300">' + '★'.repeat(5-n) + '</span>'; }

async function loadData() {
  const [fb, cats] = await Promise.all([fetchJSON(SCRIPT_URL+'?action=all'), fetchJSON(SCRIPT_URL+'?action=categories')]);
  allFeedback = fb; categories = cats;
  document.getElementById('filter-cat').innerHTML = '<option value="">All Categories</option>' + cats.map(c=>`<option>${c}</option>`).join('');
  renderFeed();
}

function renderFeed() {
  const search = document.getElementById('search').value.toLowerCase();
  const cat = document.getElementById('filter-cat').value;
  const status = document.getElementById('filter-status').value;
  const filtered = allFeedback.filter(f => {
    if (cat && f.Category !== cat) return false;
    if (status && (f.Status||'New') !== status) return false;
    if (search && !(f.Feedback||'').toLowerCase().includes(search) && !(f.Name||'').toLowerCase().includes(search)) return false;
    return true;
  });
  document.getElementById('no-feedback').classList.toggle('hidden', filtered.length > 0);
  document.getElementById('feed-list').innerHTML = filtered.map(f => `
    <div class="bg-white rounded-xl shadow p-3 sm:p-4">
      <div class="flex justify-between items-start gap-2 mb-1">
        <div>
          <span class="font-semibold text-sm">${f.Name||'Anonymous'}</span>
          <span class="text-xs text-gray-400 ml-1">${f.Date}</span>
          <span class="ml-1 text-xs px-1.5 py-0.5 rounded-full ${(f.Status||'New')==='Responded'?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}">${f.Status||'New'}</span>
        </div>
        <span class="text-xs bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-full">${f.Category}</span>
      </div>
      <div class="text-sm mb-1">${stars(parseInt(f.Rating)||0)}</div>
      <p class="text-sm text-gray-700 mb-2">${f.Feedback}</p>
      ${f.Response ? `<div class="p-2 bg-green-50 rounded-lg text-xs text-green-700 mb-2"><strong>Response:</strong> ${f.Response}</div>` : ''}
      <div class="flex gap-2">
        <button onclick="openRespond('${f.ID}')" class="text-xs text-green-600 font-medium hover:underline">Respond</button>
        <button onclick="deleteFb('${f.ID}')" class="text-xs text-red-500 font-medium hover:underline">Delete</button>
      </div>
      <div class="text-[10px] text-gray-400 mt-1 font-mono">${f.ID} ${f.IP ? '&bull; IP: '+f.IP : ''}</div>
      ${f.UserAgent ? `<div class="text-[10px] text-gray-400 font-mono truncate" title="${f.UserAgent}">${f.UserAgent.substring(0,80)}...</div>` : ''}
    </div>
  `).join('');
}

async function loadStats() {
  const s = await fetchJSON(SCRIPT_URL+'?action=stats');
  document.getElementById('stat-total').textContent = s.total;
  document.getElementById('stat-avg').textContent = s.avgRating;
  document.getElementById('stat-responded').textContent = s.statuses.Responded||0;
  document.getElementById('stat-new').textContent = s.statuses.New||0;
  document.getElementById('cat-stats').innerHTML = Object.entries(s.categories).map(([k,v]) =>
    `<div class="flex justify-between text-sm"><span>${k}</span><span class="font-bold">${v}</span></div>`
  ).join('');
}

// --- Categories ---
function renderCatList() {
  document.getElementById('cat-list').innerHTML = categories.map((c,i) =>
    `<span class="inline-flex items-center gap-1 bg-indigo-50 text-indigo-700 px-2 py-1 rounded-full text-xs">${c}<button onclick="removeCat(${i})" class="hover:text-red-500">&times;</button></span>`
  ).join('');
}
function addCat() { const v=document.getElementById('new-cat').value.trim(); if(v&&!categories.includes(v)){categories.push(v);renderCatList();} document.getElementById('new-cat').value=''; }
function removeCat(i) { categories.splice(i,1); renderCatList(); }

async function saveSettings() {
  await fetch(SCRIPT_URL, {method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({action:'saveCategories',auth:{username:currentUser.username,password:currentUser._pw},categories})});
  alert('Saved!'); setTimeout(loadData,2000);
}
async function runSetup() {
  if(!confirm('Reset all data?')) return;
  await fetch(SCRIPT_URL, {method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({action:'setupData',username:currentUser.username,password:currentUser._pw})});
  alert('Done!'); setTimeout(loadData,3000);
}

// --- Respond / Delete ---
function openRespond(id) {
  document.getElementById('resp-id').value=id; document.getElementById('resp-id-display').textContent=id; document.getElementById('resp-text').value='';
  const m=document.getElementById('respond-modal'); m.classList.remove('hidden'); m.classList.add('flex'); lucide.createIcons();
}
function closeModal() { const m=document.getElementById('respond-modal'); m.classList.add('hidden'); m.classList.remove('flex'); }

async function handleRespond(e) {
  e.preventDefault();
  await fetch(SCRIPT_URL, {method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({action:'respond',auth:{username:currentUser.username,password:currentUser._pw},id:document.getElementById('resp-id').value,response:document.getElementById('resp-text').value.trim()})});
  closeModal(); alert('Sent!'); setTimeout(loadData,2000);
}
async function deleteFb(id) {
  if(!confirm('Delete?')) return;
  await fetch(SCRIPT_URL, {method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({action:'delete',auth:{username:currentUser.username,password:currentUser._pw},id})});
  alert('Deleted!'); setTimeout(loadData,2000);
}

// --- Auth ---
async function handleLogin(e) {
  e.preventDefault();
  const u=document.getElementById('login-user').value.trim(), p=document.getElementById('login-pass').value.trim();
  try {
    const res = await fetch(SCRIPT_URL, {method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'login',username:u,password:p})});
    const r = await res.json();
    if(r.success && r.role==='admin') {
      currentUser={role:r.role,displayName:r.displayName,username:r.username,_pw:p};
      sessionStorage.setItem('fbAdmin',JSON.stringify(currentUser));
      showAdmin();
    } else {
      document.getElementById('login-error').textContent=r.role!=='admin'?'Admin access only':r.message||'Invalid';
      document.getElementById('login-error').classList.remove('hidden');
    }
  } catch(e) { document.getElementById('login-error').textContent='Connection error'; document.getElementById('login-error').classList.remove('hidden'); }
}
function logout() { currentUser=null; sessionStorage.removeItem('fbAdmin'); location.reload(); }

function showAdmin() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('admin-content').classList.remove('hidden');
  document.getElementById('user-badge').textContent=currentUser.displayName;
  document.getElementById('user-badge').classList.remove('hidden');
  document.getElementById('logout-btn').classList.remove('hidden');
  loadData();
}

// --- Tabs ---
function switchTab(t) {
  ['feed','stats','settings'].forEach(id => document.getElementById('tab-'+id).classList.toggle('hidden', id!==t));
  document.querySelectorAll('.tab-btn').forEach(b => {
    const active = b.dataset.tab===t;
    b.className = `tab-btn px-3 py-2 text-xs sm:text-sm font-semibold border-b-2 whitespace-nowrap ${active?'border-indigo-600 text-indigo-600':'border-transparent text-gray-500'}`;
  });
  if(t==='stats') loadStats();
  if(t==='settings') renderCatList();
}

// --- Init ---
window.onload = function() {
  const saved = sessionStorage.getItem('fbAdmin');
  if(saved) { currentUser=JSON.parse(saved); showAdmin(); }
  document.getElementById('login-form').addEventListener('submit', handleLogin);
  document.getElementById('respond-form').addEventListener('submit', handleRespond);
  lucide.createIcons();
};
</script>
</body>
</html>
