<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FEIS Feedback</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .star { cursor: pointer; transition: color 0.15s; }
    .star.active { color: #f59e0b; }
    .star.inactive { color: #d1d5db; }
  </style>
</head>
<body class="min-h-screen bg-gray-50">

<header class="bg-white shadow-md p-3 sm:p-4">
  <div class="max-w-lg mx-auto text-center">
    <h1 class="text-xl sm:text-2xl font-extrabold">
      <span class="text-red-800">Five</span> <span class="text-yellow-500">Elements</span>
      <span class="text-red-800">International</span> <span class="text-yellow-500">School</span>
    </h1>
    <p class="text-gray-500 text-sm mt-1">Share your feedback with us</p>
  </div>
</header>

<main class="max-w-lg mx-auto p-3 sm:p-6 mt-4">
  <div class="bg-white rounded-xl shadow-lg p-4 sm:p-6">
    <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
      <i data-lucide="message-square" class="w-5 h-5 text-indigo-600"></i> Submit Feedback
    </h2>
    <form id="feedback-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Your Name <span class="text-gray-400">(leave blank for anonymous)</span></label>
        <input id="fb-name" type="text" placeholder="Anonymous" class="w-full rounded-lg border p-2.5 text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
        <select id="fb-category" required class="w-full rounded-lg border p-2.5 text-sm">
          <option>Loading...</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Rating</label>
        <div id="star-rating" class="flex gap-1 text-3xl">
          <span class="star inactive" data-v="1" onclick="setRating(1)">★</span>
          <span class="star inactive" data-v="2" onclick="setRating(2)">★</span>
          <span class="star inactive" data-v="3" onclick="setRating(3)">★</span>
          <span class="star inactive" data-v="4" onclick="setRating(4)">★</span>
          <span class="star inactive" data-v="5" onclick="setRating(5)">★</span>
        </div>
        <input type="hidden" id="fb-rating" value="0">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Your Feedback</label>
        <textarea id="fb-text" rows="4" required placeholder="Share your thoughts, suggestions, or concerns..." class="w-full rounded-lg border p-2.5 text-sm"></textarea>
      </div>
      <button type="submit" id="submit-btn" class="w-full py-3 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 text-sm flex items-center justify-center gap-2">
        <i data-lucide="send" class="w-4 h-4"></i> Submit Feedback
      </button>
    </form>
    <div id="success-msg" class="hidden mt-4 p-4 bg-green-50 border border-green-200 rounded-lg text-center">
      <i data-lucide="check-circle" class="w-8 h-8 text-green-500 mx-auto mb-2"></i>
      <p class="text-green-700 font-semibold">Thank you for your feedback!</p>
      <button onclick="resetForm()" class="mt-2 text-sm text-indigo-600 font-medium hover:underline">Submit another</button>
    </div>
  </div>
</main>

<footer class="max-w-lg mx-auto px-3 py-6 text-center text-gray-500">
  <p class="font-semibold mb-1">An App by <span class="text-indigo-600 font-bold">Team Suggestors</span></p>
  <p class="text-xs">Akshara &amp; Ashritha Chandra (Grade 9) &bull; Bala Saketh Reddy (Grade 8)</p>
  <p class="text-xs">Chaitnya Swaroop &amp; Cherit Karthikeya (Grade 7)</p>
  <p class="text-xs text-gray-400 mt-1">Mentor: Ms. Srilatha</p>
</footer>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyS4Efy6RfN_ENM8R5P_uR__uRWCyQ4jXZikM-yBhGa-OwNxq7Hmjxch4EgyhUrbeF2/exec';
let selectedRating = 0;
let userIP = '';

// Fetch IP on load
fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d=>{userIP=d.ip;}).catch(()=>{});

async function loadCategories() {
  try {
    const res = await fetch(SCRIPT_URL + '?action=categories', {redirect:'follow'});
    const cats = await res.json();
    document.getElementById('fb-category').innerHTML = cats.map(c => `<option>${c}</option>`).join('');
  } catch(e) {}
}

function setRating(n) {
  selectedRating = n;
  document.getElementById('fb-rating').value = n;
  document.querySelectorAll('#star-rating .star').forEach(s => {
    s.classList.toggle('active', parseInt(s.dataset.v) <= n);
    s.classList.toggle('inactive', parseInt(s.dataset.v) > n);
  });
}

async function handleSubmit(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'Submitting...';
  try {
    await fetch(SCRIPT_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({
        action:'submit',
        name: document.getElementById('fb-name').value.trim() || 'Anonymous',
        category: document.getElementById('fb-category').value,
        rating: selectedRating,
        feedback: document.getElementById('fb-text').value.trim(),
        ip: userIP,
        userAgent: navigator.userAgent
      })
    });
    document.getElementById('feedback-form').classList.add('hidden');
    document.getElementById('success-msg').classList.remove('hidden');
    lucide.createIcons();
  } catch(err) { alert('Error: ' + err.message); }
  finally { btn.disabled = false; btn.innerHTML = '<i data-lucide="send" class="w-4 h-4"></i> Submit Feedback'; lucide.createIcons(); }
}

function resetForm() {
  document.getElementById('feedback-form').reset();
  document.getElementById('feedback-form').classList.remove('hidden');
  document.getElementById('success-msg').classList.add('hidden');
  setRating(0);
}

window.onload = function() {
  document.getElementById('feedback-form').addEventListener('submit', handleSubmit);
  loadCategories();
  lucide.createIcons();
};
</script>
</body>
</html>
